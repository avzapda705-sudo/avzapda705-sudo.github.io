name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 35
                  versionName "5.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
              implementation "androidx.cardview:cardview:1.0.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private Dialog adDialog;
              private CardView floatingCardAd;
              private static final String AD_URL = "https://omg10.com/4/11903025";
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);

                  mainWebView = new WebView(this);
                  setupWeb(mainWebView);
                  mainWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("whatsapp:") || url.contains("api.whatsapp.com") || url.startsWith("intent:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                                  return true;
                              } catch (Exception ignored) {
                                  return false;
                              }
                          }
                          return false;
                      }
                  });
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  int bHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 50, getResources().getDisplayMetrics());
                  FrameLayout.LayoutParams wp = new FrameLayout.LayoutParams(-1, -1);
                  wp.bottomMargin = bHeight;
                  root.addView(mainWebView, wp);

                  LinearLayout banner = new LinearLayout(this);
                  banner.setBackgroundColor(Color.parseColor("#111827"));
                  banner.setGravity(Gravity.CENTER_VERTICAL);
                  banner.setPadding(24, 0, 24, 0);

                  TextView badge = new TextView(this);
                  badge.setText("AD");
                  badge.setTextColor(Color.BLACK);
                  badge.setBackgroundColor(Color.parseColor("#F59E0B"));
                  badge.setPadding(8, 2, 8, 2);
                  badge.setTextSize(10);
                  banner.addView(badge);

                  TextView bTxt = new TextView(this);
                  bTxt.setText("Sponsored Rewards & Bonus");
                  bTxt.setTextColor(Color.WHITE);
                  bTxt.setTextSize(13);
                  bTxt.setPadding(16, 0, 0, 0);
                  banner.addView(bTxt, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  Button bBtn = new Button(this);
                  bBtn.setText("OPEN");
                  bBtn.setTextSize(11);
                  bBtn.setTextColor(Color.WHITE);
                  bBtn.setBackgroundColor(Color.parseColor("#7C3AED"));
                  banner.addView(bBtn);

                  View.OnClickListener bClick = v -> showAd(false);
                  banner.setOnClickListener(bClick);
                  bBtn.setOnClickListener(bClick);

                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, bHeight);
                  bp.gravity = Gravity.BOTTOM;
                  root.addView(banner, bp);

                  createCard(root);
                  setContentView(root);

                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!isFinishing() && floatingCardAd != null) {
                              floatingCardAd.setVisibility(View.VISIBLE);
                              handler.postDelayed(() -> {
                                  if (floatingCardAd != null) floatingCardAd.setVisibility(View.GONE);
                              }, 8000);
                          }
                          handler.postDelayed(this, 35000);
                      }
                  }, 12000);
              }

              private void createCard(FrameLayout root) {
                  floatingCardAd = new CardView(this);
                  floatingCardAd.setRadius(20);
                  floatingCardAd.setCardElevation(16);
                  floatingCardAd.setCardBackgroundColor(Color.WHITE);
                  floatingCardAd.setVisibility(View.GONE);

                  LinearLayout cl = new LinearLayout(this);
                  cl.setGravity(Gravity.CENTER_VERTICAL);
                  cl.setPadding(20, 16, 20, 16);

                  TextView ic = new TextView(this);
                  ic.setText("🎁");
                  ic.setTextSize(20);
                  cl.addView(ic);

                  LinearLayout tl = new LinearLayout(this);
                  tl.setOrientation(LinearLayout.VERTICAL);
                  tl.setPadding(16, 0, 8, 0);

                  TextView h = new TextView(this);
                  h.setText("Special Bonus Available!");
                  h.setTextColor(Color.BLACK);
                  h.setTextSize(13);

                  TextView s = new TextView(this);
                  s.setText("Tap to view offer & earn coins");
                  s.setTextColor(Color.GRAY);
                  s.setTextSize(11);

                  tl.addView(h);
                  tl.addView(s);
                  cl.addView(tl, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  TextView close = new TextView(this);
                  close.setText("✖");
                  close.setTextSize(16);
                  close.setTextColor(Color.GRAY);
                  close.setPadding(8, 8, 8, 8);
                  close.setOnClickListener(v -> floatingCardAd.setVisibility(View.GONE));
                  cl.addView(close);

                  cl.setOnClickListener(v -> {
                      floatingCardAd.setVisibility(View.GONE);
                      showAd(false);
                  });

                  floatingCardAd.addView(cl);
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(-1, -2);
                  cp.gravity = Gravity.TOP;
                  cp.setMargins(24, 60, 24, 0);
                  root.addView(floatingCardAd, cp);
              }

              private void setupWeb(WebView wv) {
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  wv.setWebChromeClient(new WebChromeClient());
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> showAd(true));
                  }
                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> showAd(true));
                  }
              }

              private void showAd(boolean reward) {
                  if (isFinishing()) return;
                  adDialog = new Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                  adDialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  adDialog.setCancelable(false);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout tb = new LinearLayout(this);
                  tb.setGravity(Gravity.CENTER_VERTICAL);
                  tb.setBackgroundColor(Color.parseColor("#1F2937"));
                  tb.setPadding(20, 16, 20, 16);

                  TextView tt = new TextView(this);
                  tt.setTextColor(Color.parseColor("#FBBF24"));
                  tt.setTextSize(15);
                  tt.setText("Reward in: 10s");
                  tb.addView(tt, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  Button cb = new Button(this);
                  cb.setText("✖ Close");
                  cb.setTextColor(Color.WHITE);
                  cb.setBackgroundColor(Color.parseColor("#EF4444"));
                  cb.setVisibility(View.GONE);
                  tb.addView(cb);
                  l.addView(tb);

                  WebView aw = new WebView(this);
                  setupWeb(aw);
                  aw.setWebViewClient(new WebViewClient());
                  aw.loadUrl(AD_URL);
                  l.addView(aw, new LinearLayout.LayoutParams(-1, 0, 1.0f));

                  adDialog.setContentView(l);
                  adDialog.show();

                  new CountDownTimer(10000, 1000) {
                      @Override
                      public void onTick(long m) {
                          tt.setText("Reward in: " + (m / 1000 + 1) + "s");
                      }
                      @Override
                      public void onFinish() {
                          tt.setText("🎉 Completed!");
                          cb.setVisibility(View.VISIBLE);
                      }
                  }.start();

                  cb.setOnClickListener(v -> {
                      if (adDialog != null && adDialog.isShowing()) {
                          aw.loadUrl("about:blank");
                          adDialog.dismiss();
                      }
                      if (reward && mainWebView != null) {
                          mainWebView.post(() -> mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null));
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (adDialog != null && adDialog.isShowing()) adDialog.dismiss();
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (adDialog != null && adDialog.isShowing()) return;
                  if (mainWebView != null && mainWebView.canGoBack()) mainWebView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
          
