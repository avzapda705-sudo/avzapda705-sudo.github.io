name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          cp index.html app/src/main/assets/index.html

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 26
                  versionName "4.2"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "com.startapp:inapp-sdk:5.1.0"
              implementation "androidx.annotation:annotation:1.9.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Watch To Earn"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          curl -sL https://pastebin.com/raw/u9m3hL3b -o app/src/main/java/com/watchtoearn/app/MainActivity.java || cat > app/src/main/java/com/watchtoearn/app/MainActivity.java << 'EOF'
          package com.watchtoearn.app;
          import android.app.Activity;
          import android.app.ProgressDialog;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.webkit.*;
          import android.widget.FrameLayout;
          import com.startapp.sdk.adsbase.*;
          import com.startapp.sdk.adsbase.adlisteners.*;
          import com.startapp.sdk.ads.banner.Banner;

          public class MainActivity extends Activity {
              private WebView webView;
              private StartAppAd rewardedAd, videoFallbackAd;
              private ProgressDialog progressDialog;
              private Handler handler = new Handler(Looper.getMainLooper());
              private boolean isShowing = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  StartAppSDK.init(this, "208761301", false);
                  StartAppSDK.enableReturnAds(false);
                  rewardedAd = new StartAppAd(this);
                  videoFallbackAd = new StartAppAd(this);
                  loadAds();

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void showRewarded() {
                          runOnUiThread(() -> {
                              if (rewardedAd.isReady()) { play(rewardedAd); return; }
                              if (videoFallbackAd.isReady()) { play(videoFallbackAd); return; }
                              progressDialog = ProgressDialog.show(MainActivity.this, "", "Loading video ad...", true);
                              rewardedAd.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() {
                                  public void onReceiveAd(Ad ad) { hide(); play(rewardedAd); }
                                  public void onFailedToReceiveAd(Ad ad) {
                                      videoFallbackAd.loadAd(StartAppAd.AdMode.VIDEO, new AdEventListener() {
                                          public void onReceiveAd(Ad a) { hide(); play(videoFallbackAd); }
                                          public void onFailedToReceiveAd(Ad a) { hide(); fallbackCard(); }
                                      });
                                  }
                              });
                              handler.postDelayed(() -> { if (progressDialog != null && progressDialog.isShowing()) { hide(); fallbackCard(); } }, 5000);
                          });
                      }
                      @JavascriptInterface
                      public void showInterstitial() { runOnUiThread(() -> StartAppAd.showAd(MainActivity.this)); }
                  }, "AndroidAd");

                  webView.loadUrl("file:///android_asset/index.html");
                  FrameLayout.LayoutParams wp = new FrameLayout.LayoutParams(-1, -1);
                  wp.bottomMargin = 130;
                  root.addView(webView, wp);

                  Banner b = new Banner(this);
                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, -2);
                  bp.gravity = Gravity.BOTTOM;
                  root.addView(b, bp);
                  setContentView(root);

                  handler.postDelayed(new Runnable() {
                      public void run() {
                          if (!isShowing) StartAppAd.showAd(MainActivity.this);
                          handler.postDelayed(this, 45000);
                      }
                  }, 20000);
              }

              private void loadAds() {
                  rewardedAd.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() { public void onReceiveAd(Ad ad){} public void onFailedToReceiveAd(Ad ad){} });
                  videoFallbackAd.loadAd(StartAppAd.AdMode.VIDEO, new AdEventListener() { public void onReceiveAd(Ad ad){} public void onFailedToReceiveAd(Ad ad){} });
              }

              private void hide() { if (progressDialog != null) progressDialog.dismiss(); }

              private void play(StartAppAd ad) {
                  isShowing = true;
                  ad.setVideoListener(() -> webView.post(() -> webView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null)));
                  ad.showAd(new AdDisplayListener() {
                      public void adHidden(Ad a) { isShowing = false; loadAds(); }
                      public void adDisplayed(Ad a) {}
                      public void adClicked(Ad a) {}
                      public void adNotDisplayed(Ad a) { isShowing = false; fallbackCard(); }
                  });
              }

              private void fallbackCard() {
                  isShowing = true;
                  StartAppAd card = new StartAppAd(this);
                  card.loadAd(StartAppAd.AdMode.AUTOMATIC, new AdEventListener() {
                      public void onReceiveAd(Ad a) {
                          card.showAd(new AdDisplayListener() {
                              public void adHidden(Ad ad) { isShowing = false; reward(); loadAds(); }
                              public void adDisplayed(Ad ad) {}
                              public void adClicked(Ad ad) {}
                              public void adNotDisplayed(Ad ad) { isShowing = false; reward(); loadAds(); }
                          });
                      }
                      public void onFailedToReceiveAd(Ad a) { isShowing = false; reward(); loadAds(); }
                  });
              }

              private void reward() {
                  webView.post(() -> webView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null));
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/release/app-release.apk
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
          
