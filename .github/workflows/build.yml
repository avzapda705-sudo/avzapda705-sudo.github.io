name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 76
                  versionName "10.1"
                  multiDexEnabled true
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
              implementation "androidx.cardview:cardview:1.0.0"
              implementation "com.unity3d.ads:unity-ads:4.12.3"
              implementation "androidx.multidex:multidex:2.0.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />

              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;
          import com.unity3d.services.banners.BannerErrorInfo;
          import com.unity3d.services.banners.BannerView;
          import com.unity3d.services.banners.UnityBannerSize;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private FrameLayout rootLayout;
              private BannerView bannerView;

              private static final String UNITY_GAME_ID = "800381847";
              private static final boolean TEST_MODE = true;

              private static final String REWARDED_PLACEMENT = "BP_Rewarded_Android";
              private static final String INTERSTITIAL_PLACEMENT = "BP_Interstitial_Android";
              private static final String BANNER_PLACEMENT = "BP_Banner_Android";

              private boolean isRewardedLoaded = false;
              private boolean isInterstitialLoaded = false;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#0b0f19"));

                  mainWebView = new WebView(this);
                  setupWeb(mainWebView);
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  int bannerHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 50, getResources().getDisplayMetrics());
                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(-1, -1);
                  webParams.bottomMargin = bannerHeight;
                  rootLayout.addView(mainWebView, webParams);

                  setContentView(rootLayout);

                  initUnityAds();
              }

              private void initUnityAds() {
                  UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, TEST_MODE, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {
                          runOnUiThread(() -> {
                              loadRewardedAd();
                              loadInterstitialAd();
                              setupBanner();
                          });
                      }

                      @Override
                      public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                          handler.postDelayed(() -> initUnityAds(), 10000);
                      }
                  });
              }

              private void setupBanner() {
                  bannerView = new BannerView(this, BANNER_PLACEMENT, new UnityBannerSize(320, 50));
                  bannerView.setListener(new BannerView.IListener() {
                      @Override
                      public void onBannerLoaded(BannerView bannerAdView) {}

                      @Override
                      public void onBannerFailedToLoad(BannerView bannerAdView, BannerErrorInfo errorInfo) {
                          handler.postDelayed(() -> {
                              if (bannerView != null) bannerView.load();
                          }, 30000);
                      }

                      @Override
                      public void onBannerClick(BannerView bannerAdView) {}

                      @Override
                      public void onBannerLeftApplication(BannerView bannerAdView) {}
                  });

                  int bannerHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 50, getResources().getDisplayMetrics());
                  FrameLayout.LayoutParams bannerParams = new FrameLayout.LayoutParams(-1, bannerHeight);
                  bannerParams.gravity = Gravity.BOTTOM;
                  rootLayout.addView(bannerView, bannerParams);
                  bannerView.load();
              }

              private void loadRewardedAd() {
                  UnityAds.load(REWARDED_PLACEMENT, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          isRewardedLoaded = true;
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          isRewardedLoaded = false;
                          handler.postDelayed(() -> loadRewardedAd(), 10000);
                      }
                  });
              }

              private void loadInterstitialAd() {
                  UnityAds.load(INTERSTITIAL_PLACEMENT, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {
                          isInterstitialLoaded = true;
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAds.UnityAdsLoadError error, String message) {
                          isInterstitialLoaded = false;
                          handler.postDelayed(() -> loadInterstitialAd(), 15000);
                      }
                  });
              }

              private void grantRewardInWeb() {
                  runOnUiThread(() -> {
                      if (mainWebView != null) {
                          mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null);
                      }
                  });
              }

              private void setupWeb(WebView wv) {
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(s.getUserAgentString() + " MobileApp");
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && (url.startsWith("intent://") || url.startsWith("whatsapp://") || url.startsWith("tg://") || url.startsWith("sms:"))) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }

                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (isRewardedLoaded) {
                              isRewardedLoaded = false;
                              UnityAds.show(MainActivity.this, REWARDED_PLACEMENT, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      loadRewardedAd();
                                  }

                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      if (state.equals(UnityAds.UnityAdsShowCompletionState.COMPLETED)) {
                                          grantRewardInWeb();
                                      }
                                      loadRewardedAd();
                                  }
                              });
                          } else {
                              Toast.makeText(MainActivity.this, "Loading ad, please try in 3 seconds...", Toast.LENGTH_SHORT).show();
                              loadRewardedAd();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (isInterstitialLoaded) {
                              isInterstitialLoaded = false;
                              UnityAds.show(MainActivity.this, INTERSTITIAL_PLACEMENT, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      loadInterstitialAd();
                                  }

                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      loadInterstitialAd();
                                  }
                              });
                          } else {
                              loadInterstitialAd();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void triggerTabAd() {
                      showInterstitial();
                  }

                  @JavascriptInterface
                  public void openExternalUrl(String url) {
                      if (url != null && !url.isEmpty()) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (bannerView != null) {
                      bannerView.destroy();
                      bannerView = null;
                  }
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (mainWebView != null && mainWebView.canGoBack()) {
                      mainWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
