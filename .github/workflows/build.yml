name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 53
                  versionName "6.9"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
              implementation "androidx.cardview:cardview:1.0.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private WebView bannerWebView;
              private Dialog adDialog;
              private CardView floatingCardAd;
              private static final String AD_URL = "https://omg10.com/4/11903025";
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean bannerUserClicked = false;

              @SuppressLint("ClickableViewAccessibility")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);

                  mainWebView = new WebView(this);
                  setupWeb(mainWebView, false);
                  mainWebView.setWebViewClient(new SafeWebClient(false, false));
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  int bHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 64, getResources().getDisplayMetrics());
                  FrameLayout.LayoutParams wp = new FrameLayout.LayoutParams(-1, -1);
                  wp.bottomMargin = bHeight;
                  root.addView(mainWebView, wp);

                  // Real Monetag Live Banner Strip (Centered at Bottom)
                  bannerWebView = new WebView(this);
                  setupWeb(bannerWebView, true);
                  bannerWebView.getSettings().setLoadWithOverviewMode(true);
                  bannerWebView.getSettings().setUseWideViewPort(true);
                  bannerWebView.setHorizontalScrollBarEnabled(false);
                  bannerWebView.setVerticalScrollBarEnabled(false);
                  bannerWebView.setBackgroundColor(Color.parseColor("#0b0f19"));

                  bannerWebView.setWebViewClient(new SafeWebClient(true, false) {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(
                              "(function(){" +
                              "try{" +
                              "document.body.style.margin='0';" +
                              "document.body.style.padding='0';" +
                              "document.body.style.width='100%';" +
                              "document.body.style.height='100%';" +
                              "document.body.style.display='flex';" +
                              "document.body.style.justifyContent='center';" +
                              "document.body.style.alignItems='center';" +
                              "document.body.style.overflow='hidden';" +
                              "document.body.style.background='#0b0f19';" +
                              "}catch(e){}" +
                              "})();",
                              null
                          );
                      }
                  });
                  
                  bannerWebView.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_UP) {
                          bannerUserClicked = true;
                          handler.postDelayed(() -> bannerUserClicked = false, 2000);
                      }
                      return false;
                  });

                  bannerWebView.loadUrl(AD_URL);

                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, bHeight);
                  bp.gravity = Gravity.BOTTOM;
                  root.addView(bannerWebView, bp);

                  buildCard(root);
                  setContentView(root);

                  // 30-Second Banner Auto-Refresh Loop with Cache-Buster
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!isFinishing() && bannerWebView != null) {
                              bannerWebView.clearCache(true);
                              String refreshUrl = AD_URL + (AD_URL.contains("?") ? "&" : "?") + "cb=" + System.currentTimeMillis();
                              bannerWebView.loadUrl(refreshUrl);
                          }
                          handler.postDelayed(this, 30000);
                      }
                  }, 30000);

                  // Floating Bonus Card Loop (Only after user logs in)
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!isFinishing() && floatingCardAd != null && mainWebView != null) {
                              mainWebView.evaluateJavascript(
                                  "(function(){ var el = document.getElementById('authOverlay'); return (el && el.style.display !== 'none'); })();",
                                  isLoginOpen -> {
                                      if ("false".equals(isLoginOpen)) {
                                          floatingCardAd.setVisibility(View.VISIBLE);
                                          floatingCardAd.bringToFront();
                                          handler.postDelayed(() -> {
                                              if (floatingCardAd != null) floatingCardAd.setVisibility(View.GONE);
                                          }, 8000);
                                      }
                                  }
                              );
                          }
                          handler.postDelayed(this, 25000);
                      }
                  }, 8000);
              }

              private void buildCard(FrameLayout root) {
                  floatingCardAd = new CardView(this);
                  floatingCardAd.setRadius(24);
                  floatingCardAd.setCardElevation(24);
                  floatingCardAd.setCardBackgroundColor(Color.WHITE);
                  floatingCardAd.setVisibility(View.GONE);

                  LinearLayout cl = new LinearLayout(this);
                  cl.setGravity(Gravity.CENTER_VERTICAL);
                  cl.setPadding(20, 16, 20, 16);

                  TextView ic = new TextView(this);
                  ic.setText("🎁");
                  ic.setTextSize(22);
                  cl.addView(ic);

                  LinearLayout tl = new LinearLayout(this);
                  tl.setOrientation(LinearLayout.VERTICAL);
                  tl.setPadding(16, 0, 8, 0);

                  TextView h = new TextView(this);
                  h.setText("Special Bonus Available!");
                  h.setTextColor(Color.BLACK);
                  h.setTextSize(14);

                  TextView s = new TextView(this);
                  s.setText("Tap to view offer & earn coins");
                  s.setTextColor(Color.GRAY);
                  s.setTextSize(11);

                  tl.addView(h);
                  tl.addView(s);
                  cl.addView(tl, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  TextView close = new TextView(this);
                  close.setText("✖");
                  close.setTextSize(18);
                  close.setTextColor(Color.GRAY);
                  close.setPadding(12, 12, 12, 12);
                  close.setOnClickListener(v -> floatingCardAd.setVisibility(View.GONE));
                  cl.addView(close);

                  cl.setOnClickListener(v -> {
                      floatingCardAd.setVisibility(View.GONE);
                      showAd(false);
                  });

                  floatingCardAd.addView(cl);
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(-1, -2);
                  cp.gravity = Gravity.TOP;
                  int topMargin = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 110, getResources().getDisplayMetrics());
                  cp.setMargins(24, topMargin, 24, 0);
                  root.addView(floatingCardAd, cp);
              }

              private void setupWeb(WebView wv, boolean disableCache) {
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setRenderPriority(WebSettings.RenderPriority.HIGH);
                  if (disableCache) {
                      s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  } else {
                      s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  }
                  s.setUserAgentString(s.getUserAgentString() + " MobileApp");
                  wv.setWebChromeClient(new WebChromeClient());
              }

              private class SafeWebClient extends WebViewClient {
                  private final boolean isBanner;
                  private final boolean isRewarded;

                  public SafeWebClient(boolean isBanner, boolean isRewarded) {
                      this.isBanner = isBanner;
                      this.isRewarded = isRewarded;
                  }

                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, String url) {
                      if (url == null) return false;

                      // Banner: open external browser only if manually touched
                      if (isBanner) {
                          if (bannerUserClicked && !url.contains("omg10.com") && (url.startsWith("http://") || url.startsWith("https://"))) {
                              try {
                                  bannerUserClicked = false;
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }

                      // Rewarded Ads: COMPLETE LOCKDOWN (Never open Chrome/External Apps automatically)
                      if (isRewarded) {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              view.loadUrl(url); // Keeps user in-app
                              return true;
                          }
                          // Blocks market://, intent://, youtube:// to prevent throwing user out of app
                          return true;
                      }

                      if (url.startsWith("intent://")) {
                          try {
                              Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                              if (intent != null) {
                                  try {
                                      startActivity(intent);
                                  } catch (Exception e) {
                                      String fallback = intent.getStringExtra("browser_fallback_url");
                                      if (fallback != null) {
                                          view.loadUrl(fallback);
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                          return true;
                      }

                      boolean isExternal = !url.startsWith("http://") && !url.startsWith("https://") && !url.startsWith("file://");
                      boolean isAppRedirect = url.contains("play.google.com/store") || url.contains("youtube.com") || url.contains("youtu.be");

                      if (isExternal || isAppRedirect) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                          return true;
                      }

                      return false;
                  }

                  @Override
                  public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                      handler.proceed();
                  }
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() { runOnUiThread(() -> showAd(true)); }
                  @JavascriptInterface
                  public void showInterstitial() { runOnUiThread(() -> showAd(true)); }
              }

              @SuppressLint("ClickableViewAccessibility")
              private void showAd(boolean reward) {
                  if (isFinishing()) return;
                  adDialog = new Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                  adDialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  adDialog.setCancelable(false);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setBackgroundColor(Color.parseColor("#0b0f19"));

                  // Top Status Bar with Countdown
                  LinearLayout tb = new LinearLayout(this);
                  tb.setGravity(Gravity.CENTER_VERTICAL);
                  tb.setBackgroundColor(Color.parseColor("#1F2937"));
                  tb.setPadding(20, 16, 20, 16);

                  TextView tt = new TextView(this);
                  tt.setTextColor(Color.parseColor("#FBBF24"));
                  tt.setTextSize(15);
                  tt.setText("Reward in: 30s");
                  tb.addView(tt, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  Button cb = new Button(this);
                  cb.setText("✖ Close");
                  cb.setTextColor(Color.WHITE);
                  cb.setBackgroundColor(Color.parseColor("#EF4444"));
                  cb.setVisibility(View.GONE);
                  tb.addView(cb);
                  l.addView(tb);

                  // Container for WebView + Loading View
                  FrameLayout adContainer = new FrameLayout(this);

                  // Centered Loading View while ad is connecting
                  LinearLayout loadingBox = new LinearLayout(this);
                  loadingBox.setOrientation(LinearLayout.VERTICAL);
                  loadingBox.setGravity(Gravity.CENTER);
                  loadingBox.setBackgroundColor(Color.parseColor("#0b0f19"));

                  ProgressBar pb = new ProgressBar(this);
                  loadingBox.addView(pb);

                  TextView loadText = new TextView(this);
                  loadText.setText("Connecting best sponsor offer...");
                  loadText.setTextColor(Color.LTGRAY);
                  loadText.setTextSize(13);
                  loadText.setPadding(0, 20, 0, 0);
                  loadingBox.addView(loadText);

                  adContainer.addView(loadingBox, new FrameLayout.LayoutParams(-1, -1));

                  WebView aw = new WebView(this);
                  setupWeb(aw, false);
                  aw.setBackgroundColor(Color.parseColor("#0b0f19"));
                  aw.setWebViewClient(new SafeWebClient(false, true) {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          loadingBox.setVisibility(View.GONE);
                      }
                  });

                  // Fast load with cache-buster to fetch fresh ad quickly
                  aw.loadUrl(AD_URL + (AD_URL.contains("?") ? "&" : "?") + "rw=" + System.currentTimeMillis());
                  adContainer.addView(aw, new FrameLayout.LayoutParams(-1, -1));

                  l.addView(adContainer, new LinearLayout.LayoutParams(-1, 0, 1.0f));

                  adDialog.setContentView(l);
                  adDialog.show();

                  new CountDownTimer(30000, 1000) {
                      @Override
                      public void onTick(long m) {
                          tt.setText("Reward in: " + (m / 1000 + 1) + "s");
                      }
                      @Override
                      public void onFinish() {
                          tt.setText("🎉 Reward Ready!");
                          cb.setVisibility(View.VISIBLE);
                      }
                  }.start();

                  cb.setOnClickListener(v -> {
                      if (adDialog != null && adDialog.isShowing()) {
                          aw.loadUrl("about:blank");
                          adDialog.dismiss();
                      }
                      if (reward && mainWebView != null) {
                          mainWebView.post(() -> mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null));
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (adDialog != null && adDialog.isShowing()) adDialog.dismiss();
                  if (bannerWebView != null) bannerWebView.destroy();
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (adDialog != null && adDialog.isShowing()) return;
                  if (mainWebView != null && mainWebView.canGoBack()) mainWebView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
