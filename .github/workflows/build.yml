name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { 
                  google()
                  mavenCentral()
                  maven { url "https://repository.inmobi.com/android/" }
              }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 72
                  versionName "8.8"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
              implementation "androidx.cardview:cardview:1.0.0"
              implementation "com.inmobi.monetization:ads-sdk:10.8.0"
              implementation "com.google.android.gms:play-services-ads-identifier:18.2.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.cardview.widget.CardView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Map;

          import com.inmobi.ads.AdMetaInfo;
          import com.inmobi.ads.InMobiAdRequestStatus;
          import com.inmobi.ads.InMobiBanner;
          import com.inmobi.ads.InMobiInterstitial;
          import com.inmobi.ads.listeners.BannerAdEventListener;
          import com.inmobi.ads.listeners.InterstitialAdEventListener;
          import com.inmobi.sdk.InMobiSdk;
          import com.inmobi.sdk.SdkInitializationListener;
          import org.json.JSONException;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private InMobiBanner bannerWebView;
              private InMobiInterstitial rewardedAd;
              private Dialog adDialog;
              private CardView floatingCardAd;
              
              private static final String INMOBI_APP_KEY = "10000235577";
              private static final long REWARDED_PLACEMENT_ID = 10000826433L;
              private static final long BANNER_PLACEMENT_ID = 10000826434L;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final List<Integer> durationPool = new ArrayList<>();
              private int poolIndex = 0;

              private synchronized int getNextDuration() {
                  if (durationPool.isEmpty() || poolIndex >= durationPool.size()) {
                      durationPool.clear();
                      durationPool.add(20);
                      durationPool.add(25);
                      durationPool.add(30);
                      Collections.shuffle(durationPool);
                      poolIndex = 0;
                  }
                  return durationPool.get(poolIndex++);
              }

              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // Initialize InMobi SDK first
                  JSONObject consentObject = new JSONObject();
                  try {
                      consentObject.put(InMobiSdk.IM_GDPR_CONSENT_AVAILABLE, true);
                      consentObject.put("gdpr", "0");
                  } catch (JSONException ignored) {}

                  InMobiSdk.init(this, INMOBI_APP_KEY, consentObject, new SdkInitializationListener() {
                      @Override
                      public void onInitializationComplete(Error error) {}
                  });

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#0b0f19"));

                  mainWebView = new WebView(this);
                  setupWeb(mainWebView, false);
                  mainWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          hookShowPage(view);
                      }
                  });
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  int bHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 64, getResources().getDisplayMetrics());
                  FrameLayout.LayoutParams wp = new FrameLayout.LayoutParams(-1, -1);
                  wp.bottomMargin = bHeight;
                  root.addView(mainWebView, wp);

                  // InMobi Banner Ad at Bottom
                  bannerWebView = new InMobiBanner(this, BANNER_PLACEMENT_ID);
                  bannerWebView.setListener(new BannerAdEventListener() {
                      @Override
                      public void onAdLoadSucceeded(InMobiBanner banner, AdMetaInfo adMetaInfo) {}
                      @Override
                      public void onAdLoadFailed(InMobiBanner banner, InMobiAdRequestStatus status) {}
                  });
                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, bHeight);
                  bp.gravity = Gravity.BOTTOM;
                  root.addView(bannerWebView, bp);
                  bannerWebView.load();

                  buildCard(root);
                  setContentView(root);

                  preloadRewardedAd();

                  // Floating Bonus Card Loop
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          if (!isFinishing() && floatingCardAd != null && mainWebView != null) {
                              mainWebView.evaluateJavascript(
                                  "(function(){ var el = document.getElementById('authOverlay'); return (el && el.style.display !== 'none'); })();",
                                  isLoginOpen -> {
                                      if ("false".equals(isLoginOpen)) {
                                          floatingCardAd.setVisibility(View.VISIBLE);
                                          floatingCardAd.bringToFront();
                                          handler.postDelayed(() -> {
                                              if (floatingCardAd != null) floatingCardAd.setVisibility(View.GONE);
                                          }, 8000);
                                      }
                                  }
                              );
                          }
                          handler.postDelayed(this, 25000);
                      }
                  }, 8000);
              }

              private void hookShowPage(WebView view) {
                  view.evaluateJavascript(
                      "(function(){" +
                      "  if (window._pageHooked) return;" +
                      "  window._pageHooked = true;" +
                      "  var originalShow = window.showPage;" +
                      "  window.showPage = function(pageId) {" +
                      "    if (typeof originalShow === 'function') { originalShow(pageId); }" +
                      "    var auth = document.getElementById('authOverlay');" +
                      "    var isLoggedIn = !(auth && auth.style.display !== 'none');" +
                      "    if (isLoggedIn && ['earn', 'withdraw', 'referral'].includes(pageId)) {" +
                      "      if (window.AndroidAd) { window.AndroidAd.triggerTabAd(); }" +
                      "    }" +
                      "  };" +
                      "})();",
                      null
                  );
              }

              private void preloadRewardedAd() {
                  if (rewardedAd != null) {
                      try { rewardedAd.destroy(); } catch (Exception ignored) {}
                  }
                  rewardedAd = new InMobiInterstitial(this, REWARDED_PLACEMENT_ID, new InterstitialAdEventListener() {
                      @Override
                      public void onAdLoadFailed(InMobiInterstitial ad, InMobiAdRequestStatus status) {
                          handler.postDelayed(() -> preloadRewardedAd(), 15000);
                      }
                      @Override
                      public void onRewardsUnlocked(InMobiInterstitial ad, Map<Object, Object> rewards) {
                          if (mainWebView != null) {
                              mainWebView.post(() -> mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null));
                          }
                      }
                      @Override
                      public void onAdDismissed(InMobiInterstitial ad) {
                          preloadRewardedAd();
                      }
                  });
                  rewardedAd.load();
              }

              private void buildCard(FrameLayout root) {
                  floatingCardAd = new CardView(this);
                  floatingCardAd.setRadius(24);
                  floatingCardAd.setCardElevation(24);
                  floatingCardAd.setCardBackgroundColor(Color.WHITE);
                  floatingCardAd.setVisibility(View.GONE);

                  LinearLayout cl = new LinearLayout(this);
                  cl.setGravity(Gravity.CENTER_VERTICAL);
                  cl.setPadding(20, 16, 20, 16);

                  TextView ic = new TextView(this);
                  ic.setText("🎁");
                  ic.setTextSize(22);
                  cl.addView(ic);

                  LinearLayout tl = new LinearLayout(this);
                  tl.setOrientation(LinearLayout.VERTICAL);
                  tl.setPadding(16, 0, 8, 0);

                  TextView h = new TextView(this);
                  h.setText("Special Bonus Available!");
                  h.setTextColor(Color.BLACK);
                  h.setTextSize(14);

                  TextView s = new TextView(this);
                  s.setText("Tap to view offer & earn coins");
                  s.setTextColor(Color.GRAY);
                  s.setTextSize(11);

                  tl.addView(h);
                  tl.addView(s);
                  cl.addView(tl, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  TextView close = new TextView(this);
                  close.setText("✖");
                  close.setTextSize(18);
                  close.setTextColor(Color.GRAY);
                  close.setPadding(12, 12, 12, 12);
                  close.setOnClickListener(v -> floatingCardAd.setVisibility(View.GONE));
                  cl.addView(close);

                  cl.setOnClickListener(v -> {
                      floatingCardAd.setVisibility(View.GONE);
                      showAd();
                  });

                  floatingCardAd.addView(cl);
                  FrameLayout.LayoutParams cp = new FrameLayout.LayoutParams(-1, -2);
                  cp.gravity = Gravity.TOP;
                  int topMargin = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 110, getResources().getDisplayMetrics());
                  cp.setMargins(24, topMargin, 24, 0);
                  root.addView(floatingCardAd, cp);
              }

              private void setupWeb(WebView wv, boolean disableCache) {
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  if (disableCache) {
                      s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  } else {
                      s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  }
                  s.setUserAgentString(s.getUserAgentString() + " MobileApp");
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url == null) return false;
                          if (url.startsWith("intent://") || url.startsWith("whatsapp://") || url.startsWith("tg://") || url.startsWith("sms:")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() { runOnUiThread(() -> showAd()); }
                  @JavascriptInterface
                  public void showInterstitial() { runOnUiThread(() -> showAd()); }
                  @JavascriptInterface
                  public void triggerTabAd() { showAd(); }
              }

              private void showAd() {
                  if (rewardedAd != null && rewardedAd.isReady()) {
                      rewardedAd.show();
                  } else {
                      Toast.makeText(this, "Ad loading, please try in a moment...", Toast.LENGTH_SHORT).show();
                      if (rewardedAd != null) rewardedAd.load();
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (bannerWebView != null) bannerWebView.destroy();
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (mainWebView != null && mainWebView.canGoBack()) mainWebView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
