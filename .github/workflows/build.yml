name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          # All Monetag Tags (New MultiTag 287797 + Classic Zones 11904245, 11904271, 11904980)
          ALL_MONETAG_TAGS="<script src=\"https://quge5.com/88/tag.min.js\" data-zone=\"287797\" async data-cfasync=\"false\"></script><script>(function(s){s.dataset.zone='11904245',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script>(function(s){s.dataset.zone='11904271',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script>(function(s){s.dataset.zone='11904980',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>"
          sed -i "s|</body>|${ALL_MONETAG_TAGS}</body>|g" app/src/main/assets/index.html || true

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 53
                  versionName "6.9"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private Dialog adDialog;
              private WebView adWebView;
              private static final String AD_URL = "https://omg10.com/4/11903025";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#050b1e"));

                  mainWebView = new WebView(this);
                  setupWeb(mainWebView);
                  mainWebView.setWebViewClient(new InAppWebClient());
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  root.addView(mainWebView, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWeb(WebView wv) {
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setSupportMultipleWindows(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
                  wv.setWebChromeClient(new WebChromeClient());
              }

              private class InAppWebClient extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, String url) {
                      if (url == null) return false;

                      if (url.startsWith("file://") && !url.contains("android_asset")) {
                          view.loadUrl(url.replace("file://", "https://"));
                          return true;
                      }

                      if (url.startsWith("intent://")) {
                          try {
                              Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                              if (intent != null) {
                                  String fallback = intent.getStringExtra("browser_fallback_url");
                                  if (fallback != null) {
                                      view.loadUrl(fallback);
                                      return true;
                                  }
                              }
                          } catch (Exception ignored) {}
                          return true;
                      }

                      if (url.startsWith("http://") || url.startsWith("https://")) {
                          view.loadUrl(url);
                          return true;
                      }

                      return false;
                  }

                  @Override
                  public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                      handler.proceed();
                  }
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() { runOnUiThread(() -> showAd(true)); }
                  @JavascriptInterface
                  public void showInterstitial() { runOnUiThread(() -> showAd(false)); }
              }

              private void showAd(boolean reward) {
                  if (isFinishing()) return;
                  if (adDialog != null && adDialog.isShowing()) return;

                  adDialog = new Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                  adDialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  adDialog.setCancelable(false);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);

                  LinearLayout tb = new LinearLayout(this);
                  tb.setGravity(Gravity.CENTER_VERTICAL);
                  tb.setBackgroundColor(Color.parseColor("#1F2937"));
                  tb.setPadding(20, 16, 20, 16);

                  TextView tt = new TextView(this);
                  tt.setTextColor(Color.parseColor("#FBBF24"));
                  tt.setTextSize(15);
                  tt.setText("Reward in: 30s");
                  tb.addView(tt, new LinearLayout.LayoutParams(0, -2, 1.0f));

                  Button cb = new Button(this);
                  cb.setText("✖ Close");
                  cb.setTextColor(Color.WHITE);
                  cb.setBackgroundColor(Color.parseColor("#EF4444"));
                  cb.setVisibility(View.GONE);
                  tb.addView(cb);
                  l.addView(tb);

                  adWebView = new WebView(this);
                  setupWeb(adWebView);
                  adWebView.setWebViewClient(new InAppWebClient());
                  adWebView.loadUrl(AD_URL);
                  l.addView(adWebView, new LinearLayout.LayoutParams(-1, 0, 1.0f));

                  adDialog.setContentView(l);
                  adDialog.show();

                  new CountDownTimer(30000, 1000) {
                      @Override
                      public void onTick(long m) {
                          tt.setText("Reward in: " + (m / 1000 + 1) + "s");
                      }
                      @Override
                      public void onFinish() {
                          tt.setText("🎉 Completed!");
                          cb.setVisibility(View.VISIBLE);
                      }
                  }.start();

                  cb.setOnClickListener(v -> {
                      if (adDialog != null && adDialog.isShowing()) {
                          if (adWebView != null) {
                              adWebView.loadUrl("about:blank");
                              adWebView.destroy();
                              adWebView = null;
                          }
                          adDialog.dismiss();
                      }
                      if (reward && mainWebView != null) {
                          mainWebView.post(() -> mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();} else if(typeof userCoins !== 'undefined'){userCoins+=10; if(typeof updateCoinDisplay==='function'){updateCoinDisplay();}}", null));
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (adDialog != null && adDialog.isShowing()) adDialog.dismiss();
                  if (adWebView != null) adWebView.destroy();
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (adDialog != null && adDialog.isShowing()) return;
                  if (mainWebView != null && mainWebView.canGoBack()) mainWebView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
