name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchtoearn/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cp index.html app/src/main/assets/index.html

          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick

            for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              dim="${size%%:*}"
              folder="${size##*:}"
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
              convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
            done

            for size in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
              canvas="${size%%:*}"
              folder="${size##*:}"
              inner=$(( canvas * 88 / 108 ))
              convert icon.png -resize "${inner}x${inner}" -background none -gravity center -extent "${canvas}x${canvas}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_foreground.png
            done

            cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#050b1e</color>
          </resources>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WatchToEarn"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchtoearn.app"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchtoearn.app"
                  minSdk 24
                  targetSdk 35
                  versionCode 73
                  versionName "8.9"
                  multiDexEnabled true
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
              implementation "androidx.cardview:cardview:1.0.0"
              implementation "com.inmobi.monetization:ads-sdk:10.8.0"
              implementation "com.google.android.gms:play-services-ads-identifier:18.2.0"
              implementation "androidx.multidex:multidex:2.0.1"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />

              <application
                  android:allowBackup="true"
                  android:label="Watch To Earn"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchtoearn/app/MainActivity.java <<'EOF'
          package com.watchtoearn.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import com.inmobi.ads.AdMetaInfo;
          import com.inmobi.ads.InMobiAdRequestStatus;
          import com.inmobi.ads.InMobiBanner;
          import com.inmobi.ads.InMobiInterstitial;
          import com.inmobi.ads.InMobiNative;
          import com.inmobi.ads.listeners.BannerAdEventListener;
          import com.inmobi.ads.listeners.InterstitialAdEventListener;
          import com.inmobi.ads.listeners.NativeAdEventListener;
          import com.inmobi.sdk.InMobiSdk;
          import com.inmobi.sdk.SdkInitializationListener;

          import org.json.JSONException;
          import org.json.JSONObject;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private InMobiBanner inMobiBanner;
              private InMobiInterstitial rewardedAd;
              private InMobiInterstitial interstitialAd;
              private InMobiNative inMobiNative;

              private static final String INMOBI_APP_KEY = "10000235577";
              private static final long REWARDED_PLACEMENT_ID = 10000826433L;
              private static final long BANNER_PLACEMENT_ID = 10000826434L;
              private static final long INTERSTITIAL_PLACEMENT_ID = 10000826437L;
              private static final long NATIVE_PLACEMENT_ID = 10000826440L;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private FrameLayout rootLayout;

              @SuppressLint({"SetJavaScriptEnabled", "ClickableViewAccessibility"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#0b0f19"));

                  mainWebView = new WebView(this);
                  setupWeb(mainWebView);
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  int bannerHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 50, getResources().getDisplayMetrics());
                  FrameLayout.LayoutParams webParams = new FrameLayout.LayoutParams(-1, -1);
                  webParams.bottomMargin = bannerHeight;
                  rootLayout.addView(mainWebView, webParams);

                  setContentView(rootLayout);

                  initInMobiSdk(bannerHeight);
              }

              private void initInMobiSdk(int bannerHeight) {
                  JSONObject consentObject = new JSONObject();
                  try {
                      consentObject.put(InMobiSdk.IM_GDPR_CONSENT_AVAILABLE, true);
                      consentObject.put("gdpr", "0");
                  } catch (JSONException ignored) {}

                  InMobiSdk.init(this, INMOBI_APP_KEY, consentObject, new SdkInitializationListener() {
                      @Override
                      public void onInitializationComplete(Error error) {
                          if (error == null) {
                              runOnUiThread(() -> {
                                  setupBannerAd(bannerHeight);
                                  preloadRewardedAd();
                                  preloadInterstitialAd();
                                  loadNativeAd();
                              });
                          }
                      }
                  });
              }

              private void setupBannerAd(int bannerHeight) {
                  inMobiBanner = new InMobiBanner(this, BANNER_PLACEMENT_ID);
                  inMobiBanner.setAnimationType(InMobiBanner.AnimationType.ROTATE_HORIZONTAL_AXIS);
                  inMobiBanner.setListener(new BannerAdEventListener() {
                      @Override
                      public void onAdLoadSucceeded(InMobiBanner banner, AdMetaInfo adMetaInfo) {}

                      @Override
                      public void onAdLoadFailed(InMobiBanner banner, InMobiAdRequestStatus status) {
                          handler.postDelayed(() -> {
                              if (inMobiBanner != null) inMobiBanner.load();
                          }, 30000);
                      }
                  });

                  FrameLayout.LayoutParams bannerParams = new FrameLayout.LayoutParams(-1, bannerHeight);
                  bannerParams.gravity = Gravity.BOTTOM;
                  rootLayout.addView(inMobiBanner, bannerParams);
                  inMobiBanner.load();
              }

              private void preloadRewardedAd() {
                  rewardedAd = new InMobiInterstitial(this, REWARDED_PLACEMENT_ID, new InterstitialAdEventListener() {
                      @Override
                      public void onAdLoadFailed(InMobiInterstitial ad, InMobiAdRequestStatus status) {
                          handler.postDelayed(() -> preloadRewardedAd(), 15000);
                      }

                      @Override
                      public void onRewardsUnlocked(InMobiInterstitial ad, Map<Object, Object> rewards) {
                          grantRewardInWeb();
                      }

                      @Override
                      public void onAdDismissed(InMobiInterstitial ad) {
                          preloadRewardedAd();
                      }
                  });
                  rewardedAd.load();
              }

              private void preloadInterstitialAd() {
                  interstitialAd = new InMobiInterstitial(this, INTERSTITIAL_PLACEMENT_ID, new InterstitialAdEventListener() {
                      @Override
                      public void onAdLoadFailed(InMobiInterstitial ad, InMobiAdRequestStatus status) {
                          handler.postDelayed(() -> preloadInterstitialAd(), 20000);
                      }

                      @Override
                      public void onAdDismissed(InMobiInterstitial ad) {
                          preloadInterstitialAd();
                      }
                  });
                  interstitialAd.load();
              }

              private void loadNativeAd() {
                  inMobiNative = new InMobiNative(this, NATIVE_PLACEMENT_ID, new NativeAdEventListener() {
                      @Override
                      public void onAdLoadSucceeded(InMobiNative ad, AdMetaInfo info) {
                          runOnUiThread(() -> {
                              if (mainWebView != null && ad != null) {
                                  String title = ad.getAdTitle() != null ? ad.getAdTitle().replace("'", "\\'") : "";
                                  String desc = ad.getAdDescription() != null ? ad.getAdDescription().replace("'", "\\'") : "";
                                  String iconUrl = ad.getAdIconUrl() != null ? ad.getAdIconUrl() : "";
                                  String clickUrl = ad.getAdLandingPageUrl() != null ? ad.getAdLandingPageUrl() : "";

                                  mainWebView.evaluateJavascript(
                                      "if(window.renderNativeAd){window.renderNativeAd('" + title + "', '" + desc + "', '" + iconUrl + "', '" + clickUrl + "');}",
                                      null
                                  );
                              }
                          });
                      }

                      @Override
                      public void onAdLoadFailed(InMobiNative ad, InMobiAdRequestStatus status) {
                          handler.postDelayed(() -> loadNativeAd(), 30000);
                      }
                  });
                  inMobiNative.load();
              }

              private void grantRewardInWeb() {
                  runOnUiThread(() -> {
                      if (mainWebView != null) {
                          mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null);
                      }
                  });
              }

              private void setupWeb(WebView wv) {
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUserAgentString(s.getUserAgentString() + " MobileApp");
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && (url.startsWith("intent://") || url.startsWith("whatsapp://") || url.startsWith("tg://") || url.startsWith("sms:"))) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }

                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }
                  });
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (rewardedAd != null && rewardedAd.isReady()) {
                              rewardedAd.show();
                          } else {
                              Toast.makeText(MainActivity.this, "Loading ad, please try in 3 seconds...", Toast.LENGTH_SHORT).show();
                              if (rewardedAd != null) rewardedAd.load();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (interstitialAd != null && interstitialAd.isReady()) {
                              interstitialAd.show();
                          } else if (interstitialAd != null) {
                              interstitialAd.load();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void triggerTabAd() {
                      showInterstitial();
                  }

                  @JavascriptInterface
                  public void openExternalUrl(String url) {
                      if (url != null && !url.isEmpty()) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (inMobiBanner != null) inMobiBanner.destroy();
                  if (inMobiNative != null) inMobiNative.destroy();
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (mainWebView != null && mainWebView.canGoBack()) {
                      mainWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchToEarn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchToEarn-APK
          path: apk-output/WatchToEarn.apk
          if-no-files-found: error
